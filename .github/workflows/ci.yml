name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [user, url, gateway, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [user, url, gateway, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user, url, gateway, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci
  push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [user, url, gateway, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          docker build -f ${{ matrix.service }}/Dockerfile -t $IMAGE
          docker push $IMAGE